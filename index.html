<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="蓝海清洁服务 BlueOcean Clean — 专业海洋与海滩清洁服务，守护蓝色家园。Professional ocean & beach cleanup services." />
  <title>蓝海清洁服务 | Ocean Cleaning Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 导航栏 -->
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#home" class="logo">
        <span class="logo-icon">🌊</span>
        <span class="logo-text" data-en="BlueOcean Clean" data-zh="蓝海清洁服务"></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="#home" data-en="Home" data-zh="首页"></a>
        <a href="#about" data-en="About" data-zh="关于我们"></a>
        <a href="#services" data-en="Services" data-zh="服务项目"></a>
        <a href="#why" data-en="Why Us" data-zh="为什么选我们"></a>
        <a href="#contact" data-en="Contact" data-zh="联系我们"></a>
      </nav>
      <div class="nav-actions">
        <button class="lang-btn" id="langToggle" type="button">EN</button>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="菜单 / Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- 首屏 -->
  <section class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="container hero-inner">
      <p class="hero-eyebrow reveal" data-en="Protecting our blue planet" data-zh="守护我们的蓝色星球"></p>
      <h1 class="hero-title reveal">
        <span class="block" data-en="Cleaner Oceans," data-zh="更洁净的海洋，"></span>
        <span class="block accent" data-en="Healthier Future" data-zh="更健康的未来"></span>
      </h1>
      <p class="hero-sub reveal" data-en="Professional ocean, beach and coastal cleanup services — keeping our waters clean and safe for everyone." data-zh="专业的海洋、海滩与海岸线清洁服务，让水域保持洁净、安全，惠及每一个人。"></p>
      <div class="hero-btns reveal">
        <a href="#contact" class="btn btn-primary" data-en="Book a Service" data-zh="预约服务"></a>
        <a href="#services" class="btn btn-ghost" data-en="Explore Services" data-zh="了解服务"></a>
      </div>
    </div>
    <div class="wave-divider">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,64 C240,120 480,0 720,40 C960,80 1200,20 1440,64 L1440,120 L0,120 Z" fill="#f4f9fb"></path>
      </svg>
    </div>
  </section>

  <!-- 关于我们 -->
  <section class="section" id="about">
    <div class="container">
      <div class="about-grid">
        <div class="about-text reveal">
          <span class="tag" data-en="About Us" data-zh="关于我们"></span>
          <h2 class="section-title" data-en="Committed to a Cleaner Ocean" data-zh="致力于让海洋更洁净"></h2>
          <p data-en="BlueOcean Clean is a professional ocean cleaning service dedicated to removing waste from our seas, beaches and coastlines. We combine skilled teams, modern equipment and eco-friendly methods to restore and protect marine environments." data-zh="蓝海清洁服务是一家专业的海洋清洁机构，致力于清除海洋、海滩与海岸线上的废弃物。我们结合专业的团队、先进的设备与环保的方法，修复并守护海洋环境。"></p>
          <p data-en="Every cleanup we carry out helps protect marine life, keep communities safe and build a more sustainable blue future." data-zh="每一次清洁行动，都有助于保护海洋生物、保障社区安全，并共同构建更加可持续的蓝色未来。"></p>
          <div class="stats">
            <div class="stat"><span class="stat-num">500+</span><span class="stat-label" data-en="Cleanups Done" data-zh="清洁行动"></span></div>
            <div class="stat"><span class="stat-num">120t</span><span class="stat-label" data-en="Waste Removed" data-zh="清除垃圾"></span></div>
            <div class="stat"><span class="stat-num">10+</span><span class="stat-label" data-en="Service Areas" data-zh="服务区域"></span></div>
          </div>
        </div>
        <div class="about-visual reveal">
          <div class="about-img"><span class="about-emoji">🌊</span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 服务项目 -->
  <section class="section section-alt" id="services">
    <div class="container">
      <div class="section-head reveal">
        <span class="tag" data-en="Our Services" data-zh="服务项目"></span>
        <h2 class="section-title" data-en="What We Do" data-zh="我们能做什么"></h2>
        <p class="section-desc" data-en="Comprehensive ocean cleaning solutions for beaches, coastlines and open waters." data-zh="面向海滩、海岸线与开阔海域的全面海洋清洁解决方案。"></p>
      </div>
      <div class="cards-grid">
        <div class="card reveal">
          <div class="card-icon">🌊</div>
          <h3 data-en="Beach Cleanup" data-zh="海滩清洁"></h3>
          <p data-en="Removing litter, plastics and debris to restore clean, safe beaches." data-zh="清除垃圾、塑料与废弃物，恢复干净安全的海滩。"></p>
        </div>
        <div class="card reveal">
          <div class="card-icon">🚢</div>
          <h3 data-en="Marine Debris Collection" data-zh="海洋垃圾打捞"></h3>
          <p data-en="Collecting floating waste and plastics from the sea surface." data-zh="打捞海面漂浮垃圾与塑料，减少海洋污染。"></p>
        </div>
        <div class="card reveal">
          <div class="card-icon">🤿</div>
          <h3 data-en="Underwater Cleanup" data-zh="水下清理"></h3>
          <p data-en="Dive teams removing debris from seabeds and reef areas." data-zh="潜水团队清除海床与珊瑚礁区域的废弃物。"></p>
        </div>
        <div class="card reveal">
          <div class="card-icon">🏖️</div>
          <h3 data-en="Coastline Restoration" data-zh="海岸线修复"></h3>
          <p data-en="Restoring and maintaining coastal ecosystems against erosion." data-zh="修复并维护海岸线生态系统，防止侵蚀。"></p>
        </div>
        <div class="card reveal">
          <div class="card-icon">🛢️</div>
          <h3 data-en="Oil Spill Response" data-zh="油污应急处理"></h3>
          <p data-en="Rapid response to oil spills to reduce harm to marine life." data-zh="快速应对油污泄漏，减轻对海洋生态的伤害。"></p>
        </div>
        <div class="card reveal">
          <div class="card-icon">📚</div>
          <h3 data-en="Environmental Education" data-zh="环保教育"></h3>
          <p data-en="Awareness programs for schools, businesses and communities." data-zh="为学校、企业与社区提供环保意识教育活动。"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 为什么选择我们 -->
  <section class="section" id="why">
    <div class="container">
      <div class="section-head reveal">
        <span class="tag" data-en="Why Choose Us" data-zh="为什么选择我们"></span>
        <h2 class="section-title" data-en="Why Work With Us" data-zh="为什么与我们合作"></h2>
      </div>
      <div class="why-grid">
        <div class="why-item reveal">
          <div class="why-icon">♻️</div>
          <h3 data-en="Eco-friendly Methods" data-zh="环保作业方法"></h3>
          <p data-en="Non-toxic, sustainable materials and techniques." data-zh="使用无毒、可持续的材料与技术。"></p>
        </div>
        <div class="why-item reveal">
          <div class="why-icon">👷</div>
          <h3 data-en="Professional Team" data-zh="专业团队"></h3>
          <p data-en="Certified, experienced cleaning specialists." data-zh="持证且经验丰富的清洁专业人员。"></p>
        </div>
        <div class="why-item reveal">
          <div class="why-icon">🛥️</div>
          <h3 data-en="Advanced Equipment" data-zh="先进设备"></h3>
          <p data-en="Modern vessels and tools for efficient cleanup." data-zh="现代化船只与设备，清洁高效。"></p>
        </div>
        <div class="why-item reveal">
          <div class="why-icon">📍</div>
          <h3 data-en="Wide Coverage" data-zh="覆盖范围广"></h3>
          <p data-en="Serving coastlines, ports and open waters." data-zh="服务海岸线、港口与开阔海域。"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 联系我们 -->
  <section class="section section-alt" id="contact">
    <div class="container">
      <div class="section-head reveal">
        <span class="tag" data-en="Contact Us" data-zh="联系我们"></span>
        <h2 class="section-title" data-en="Get in Touch" data-zh="与我们联系"></h2>
        <p class="section-desc" data-en="Have a question or need a quote? We'd love to hear from you." data-zh="有问题或需要报价？欢迎随时联系我们。"></p>
      </div>
      <div class="contact-grid">
        <div class="contact-info reveal">
          <div class="info-item">
            <span class="info-icon">📞</span>
            <div><h4 data-en="Phone" data-zh="电话"></h4><a href="tel:+60123456789">+60 12-345 6789</a></div>
          </div>
          <div class="info-item">
            <span class="info-icon">💬</span>
            <div><h4>WhatsApp</h4><a href="https://wa.me/60123456789" target="_blank" rel="noopener">+60 12-345 6789</a></div>
          </div>
          <div class="info-item">
            <span class="info-icon">✉️</span>
            <div><h4 data-en="Email" data-zh="邮箱"></h4><a href="mailto:hello@blueoceanclean.com">hello@blueoceanclean.com</a></div>
          </div>
          <div class="info-item">
            <span class="info-icon">📍</span>
            <div><h4 data-en="Address" data-zh="地址"></h4><p data-en="Kuala Lumpur, Malaysia" data-zh="马来西亚，吉隆坡"></p></div>
          </div>
          <div class="info-item">
            <span class="info-icon">🕒</span>
            <div><h4 data-en="Working Hours" data-zh="工作时间"></h4><p data-en="Mon – Sat, 9:00 – 18:00" data-zh="周一至周六 9:00 – 18:00"></p></div>
          </div>
        </div>
        <form class="contact-form reveal" id="contactForm">
          <div class="form-row">
            <input type="text" name="name" required data-en-ph="Your name" data-zh-ph="您的姓名" />
            <input type="email" name="email" required data-en-ph="Email address" data-zh-ph="邮箱地址" />
          </div>
          <input type="tel" name="phone" data-en-ph="Phone (optional)" data-zh-ph="联系电话（选填）" />
          <textarea name="message" rows="5" required data-en-ph="Tell us about your needs..." data-zh-ph="请描述您的需求……"></textarea>
          <button type="submit" class="btn btn-primary btn-block" data-en="Send Message" data-zh="发送消息"></button>
          <p class="form-success" id="formSuccess" data-en="✅ Thank you! We'll get back to you shortly." data-zh="✅ 感谢您的留言！我们会尽快回复您。"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- 页脚 -->

        <div class="logo">

        <p data-en="Professional ocean cleaning services for a cleaner, healthier planet." data-zh="专业的海洋清洁服务，共创更洁净、更健康的地球。"></p>
      </div>
      <nav class="footer-nav">
        <a href="#about" data-en="About" data-zh="关于我们"></a>
        <a href="#services" data-en="Services" data-zh="服务项目"></a>
        <a href="#contact" data-en="Contact" data-zh="联系我们"></a>
      </nav>

    <div class="footer-bottom">
      <p>© <span id="year"></span> <span data-en="BlueOcean Clean. All rights reserved." data-zh="蓝海清洁服务 版权所有。"></span></p>
    </div>
  </footer>
